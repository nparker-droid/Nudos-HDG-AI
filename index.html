<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroScan - Gestor de Nudos Hidráulicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        
        #root:empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: #f8fafc;
        }
        #root:empty::after {
            content: "";
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #004071;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        #root:empty::before {
            content: "HIDROSCAN";
            margin-bottom: 24px;
            font-weight: 900;
            letter-spacing: 0.5em;
            color: #004071;
            font-size: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
    </style>
    <script>
        // Configuración de entorno global requerida por el SDK de Gemini
        window.process = {
            env: {
                API_KEY: "" // Inyectada por el entorno
            }
        };

        // Captura de errores para diagnóstico visual
        window.addEventListener('error', function(event) {
            console.error('Error detectado:', event.error);
            const overlay = document.getElementById('error-ui');
            const msg = document.getElementById('error-msg');
            if (overlay && msg) {
                overlay.style.display = 'flex';
                msg.textContent = event.message || 'Error desconocido al cargar módulos.';
            }
        });
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "jspdf": "https://esm.sh/jspdf@^4.1.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <div id="error-ui" class="error-overlay">
        <i class="fa-solid fa-triangle-exclamation text-red-500 text-5xl mb-4"></i>
        <h2 class="text-xl font-black text-slate-800 uppercase">Fallo en la Carga del Sistema</h2>
        <p id="error-msg" class="text-slate-500 mt-2 text-sm max-w-md"></p>
        <button onclick="location.reload()" class="mt-8 px-8 py-3 bg-[#004071] text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl">
            Reintentar Conexión
        </button>
    </div>

    <!-- CARGADOR ESM.SH: Esta es la forma correcta y única de usarlo para TSX -->
    <script src="https://esm.sh/run" data-main="./index.tsx"></script>
</body>
</html>
