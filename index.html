
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroScan - Gestor de Nudos Hidráulicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #error-display {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 9999;
            padding: 20px; text-align: center;
            flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "jspdf": "https://esm.sh/jspdf@2.5.1"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div id="root"></div>
    <div id="error-display">
        <h1 style="color: #004071; font-weight: 900; font-size: 24px;">Error al cargar la aplicación</h1>
        <p id="error-message" style="color: #64748b; margin-top: 10px; font-family: monospace;"></p>
        <button onclick="location.reload()" style="margin-top: 20px; padding: 12px 24px; background: #88C13E; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">
            Reintentar Carga
        </button>
    </div>

    <!-- Cargador dinámico robusto para archivos TSX -->
    <script type="module">
      const errorDisplay = document.getElementById('error-display');
      const errorMessage = document.getElementById('error-message');

      window.onerror = function(msg, url, line, col, error) {
          console.error("Global Error:", msg, error);
          errorDisplay.style.display = 'flex';
          errorMessage.innerText = `${msg}\nEn: ${url}:${line}`;
      };

      import { run } from 'https://esm.sh/run';
      
      try {
          // El archivo index.tsx debe estar en la misma carpeta raíz que index.html
          run('./index.tsx').catch(err => {
              console.error('Error durante la ejecución de run():', err);
              errorDisplay.style.display = 'flex';
              errorMessage.innerText = `Fallo en el cargador: ${err.message || 'Error desconocido de módulos'}`;
          });
      } catch (e) {
          errorDisplay.style.display = 'flex';
          errorMessage.innerText = `Excepción inmediata: ${e.message}`;
      }
    </script>
</body>
</html>
