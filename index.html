<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroScan - Gestor de Nudos Hidráulicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        
        #root:empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: #f8fafc;
        }
        #root:empty::after {
            content: "";
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #004071;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        #root:empty::before {
            content: "HIDROSCAN";
            margin-bottom: 24px;
            font-weight: 900;
            letter-spacing: 0.5em;
            color: #004071;
            font-size: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        // Shim para process.env requerido por el SDK de Gemini
        window.process = {
            env: {
                API_KEY: "" 
            }
        };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.41.0",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
