<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroScan - Gestor de Nudos Hidráulicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        
        /* Spinner de carga inicial */
        #root:empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: #f8fafc;
        }
        #root:empty::after {
            content: "";
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #004071;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #root:empty::before {
            content: "HIDROSCAN";
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: 0.3em;
            color: #004071;
            font-size: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Overlay de error para diagnóstico */
        .error-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 9999;
        }
    </style>
    <script>
        // Configuración crítica de entorno
        window.process = { 
            env: { 
                API_KEY: "" // Se inyecta automáticamente en Vercel
            } 
        };

        // Capturador de errores globales para evitar el spinner infinito sin info
        window.onerror = function(msg, url, line, col, error) {
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                root.innerHTML = `
                    <div class="error-screen">
                        <i class="fa-solid fa-circle-exclamation text-red-500 text-4xl mb-4"></i>
                        <h1 class="text-xl font-black text-slate-800 uppercase">Error de Inicialización</h1>
                        <p class="text-sm text-slate-500 mt-2">${msg}</p>
                        <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-[#004071] text-white rounded-xl font-bold text-xs">REINTENTAR</button>
                    </div>
                `;
            }
        };
    </script>
<script type="importmap">
