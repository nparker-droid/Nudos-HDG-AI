<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroScan - Gestor de Nudos Hidráulicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        
        #root:empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: #f8fafc;
        }
        #root:empty::after {
            content: "";
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #004071;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            display: none;
            padding: 20px;
            text-align: center;
            color: #64748b;
        }
    </style>
    <script>
        // SHIM GLOBAL: Previene errores de 'process is not defined'
        window.process = { env: { API_KEY: "" } };
        
        // Timeout para mostrar ayuda si no carga
        setTimeout(() => {
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                document.getElementById('error-ui').style.display = 'block';
            }
        }, 8000);
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "jspdf": "https://esm.sh/jspdf@^4.1.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div id="error-ui" class="error-message">
        <h2 style="color:#004071; font-weight:900;">HIDROSCAN</h2>
        <p>Cargando módulos del sistema...</p>
        <small>Si la carga persiste, por favor recarga la página.</small>
    </div>

    <!-- Método de carga infalible para esm.sh/run -->
    <script type="module">
        import "https://esm.sh/run";
    </script>
    <script type="text/babel" src="./index.tsx" data-type="module"></script>
</body>
</html>
