<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroScan - Gestor de Nudos Hidráulicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow-x: hidden; }
        
        /* Spinner de carga inicial */
        #root:empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: #f8fafc;
        }
        #root:empty::after {
            content: "";
            width: 50px;
            height: 50px;
            border: 5px solid #e2e8f0;
            border-top-color: #004071;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        #root:empty::before {
            content: "Iniciando HidroScan...";
            font-weight: 800;
            color: #004071;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Estilos para errores críticos */
        .error-overlay {
            position: fixed;
            inset: 0;
            background: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 9999;
        }
    </style>
    <script>
        // SHIM GLOBAL: Crucial para que el SDK de Gemini no explote
        window.process = { 
            env: { 
                API_KEY: "" // Vercel inyectará esto automáticamente en el runtime
            } 
        };

        // Capturador de errores para depuración en vivo
        window.onerror = function(msg, url, line) {
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                root.innerHTML = `<div class="error-overlay">
                    <h1 style="color:red; font-weight:900;">ERROR DE CARGA</h1>
                    <p style="color:gray;">${msg}</p>
                    <p style="font-size:10px;">${url} : L${line}</p>
                    <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; background:#004071; color:white; border-radius:10px; border:none; cursor:pointer;">REINTENTAR</button>
                </div>`;
            }
        };
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "jspdf": "https://esm.sh/jspdf@^4.1.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- Cargador esm.sh/run: Maneja TypeScript y dependencias automáticamente -->
    <script type="module">
        import { run } from "https://esm.sh/run";
        
        // Ejecutamos la aplicación. 
        // ESM.SH resolverá React, Gemini y jspdf automáticamente desde los imports de index.tsx
        run("./index.tsx").catch(err => {
            console.error("Fallo al iniciar la app:", err);
            document.body.innerHTML += `<div class="error-overlay"><h1>Error de Sistema</h1><p>${err.message}</p></div>`;
        });
    </script>
</body>
</html>
